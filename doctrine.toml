# This project's contract. Making anything here looser needs the approver's approval on the pull request.

[project]
name = "Galileo"
doctrine_version = "0.3.2"
approver = "OmarAbdo"

[outcome]
# The one number this project exists to move: Omar's weakest score against his baseline week
# (docs/design.md, rule 6; decision G7). 1 is his baseline; the line stops under 0.8 of it.
metric = "the lowest of Omar's focus, understanding and hands, each as a share of his baseline week"
command = ["python", "-m", "galileo.adapters.outcome"]
baseline = 1
stop_below = 0.8

[[services]]
name = "galileo"
path = "src/galileo"
profile = "python"
architecture = "hexagonal"
tests = "tests"
