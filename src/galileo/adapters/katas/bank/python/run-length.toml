tests = '''
import unittest

from solution import decode, encode


class RunLengthTest(unittest.TestCase):
    def test_encode(self) -> None:
        self.assertEqual(encode("aaabcc"), "3ab2c")
        self.assertEqual(encode("abc"), "abc")
        self.assertEqual(encode(""), "")

    def test_decode(self) -> None:
        self.assertEqual(decode("3ab2c"), "aaabcc")
        self.assertEqual(decode("12a"), "a" * 12)

    def test_there_and_back(self) -> None:
        text = "wwwwwwwwwwwwbbbx"
        self.assertEqual(decode(encode(text)), text)
