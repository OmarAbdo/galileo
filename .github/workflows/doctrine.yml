# Doctrine's gates on every pull request. This file is guarded: changing it needs the approver.
name: doctrine

on:
  pull_request:

jobs:
  gates:
    # A called workflow gets no more than this job grants; new repositories grant almost nothing.
    permissions:
      contents: read
      pull-requests: read
    uses: OmarAbdo/doctrine/.github/workflows/project-gates.yml@v0.3.2
    with:
      doctrine_ref: v0.3.2
